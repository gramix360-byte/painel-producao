<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#123a70">
<title>Produção | Painel de Produção</title>
<link rel="icon" href="./logo.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./blue-theme.css">
<style>
body.tv-body{background:#f4f8fd!important;color:#172b45}.tv-header{background:#123a70!important;color:#fff;border-bottom:0;box-shadow:0 4px 18px rgba(23,76,143,.16)}.tv-main{background:#f4f8fd}.tv-main>section{background:#fff;border:1px solid #d9e5f2;border-radius:18px;padding:14px;box-shadow:0 8px 28px rgba(23,76,143,.08);align-self:start}.tv-column-head.waiting{background:#2f80d1!important}.tv-column-head.doing{background:#123a70!important}.tv-card{border-color:#d9e5f2;box-shadow:0 6px 20px rgba(23,76,143,.10)}.tv-card-top{background:#edf5ff!important}.tv-card.doing{border-color:#8db9e8}.tv-card.doing .tv-card-top{background:#e4f0fc!important}.tv-number{color:#1769c2!important}.tv-item>strong{background:#1769c2!important}.tv-empty{border-color:#b9cde2;color:#6b7f96;background:#f8fbff}.tv-new-order{background:#1769c2!important}
@media (min-width:1051px){.tv-main{grid-template-columns:minmax(300px,32%) minmax(0,68%)}.tv-main>section:first-child .tv-number{font-size:32px}.tv-main>section:first-child .tv-customer{font-size:16px}.tv-main>section:first-child .tv-item b{font-size:16px}.tv-main>section:first-child .tv-item>strong{min-width:52px;font-size:19px}.tv-main>section:last-child .tv-number{font-size:44px}.tv-main>section:last-child .tv-customer{font-size:20px}.tv-main>section:last-child .tv-item b{font-size:19px}}
</style>
</head>
<body class="tv-body" style="visibility:hidden">
<header class="tv-header"><div><div class="tv-brand">PAINEL DE PRODUÇÃO</div><div id="tv-clock" class="tv-clock"></div></div><div class="tv-header-right"><span id="tv-status" class="connection online">Online</span><button id="tv-fullscreen" class="button secondary">Tela cheia</button><button id="tv-logout" class="button secondary">Sair</button></div></header>
<main class="tv-main"><section><div class="tv-column-head waiting"><h1>AGUARDANDO</h1><strong id="waiting-count">0</strong></div><div id="tv-waiting" class="tv-orders"></div></section><section><div class="tv-column-head doing"><h1>EM PRODUÇÃO</h1><strong id="doing-count">0</strong></div><div id="tv-doing" class="tv-orders"></div></section></main>
<div id="tv-toast" class="tv-new-order">NOVO PEDIDO RECEBIDO</div>
<script src="./auth-client.js"></script><script>window.PPAuth.requireAuth().then(s=>{if(s){document.body.style.visibility='visible';document.getElementById('tv-logout').addEventListener('click',()=>window.PPAuth.logout())}})</script>
<script type="module" src="./producao.js"></script>
</body></html>
