<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#404040"><title>Entrar | Painel de Produção</title><link rel="icon" href="./logo.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./login.css"></head>
<body class="login-body"><main class="login-shell"><section class="login-card"><div class="login-logo"><img src="./logo.svg" alt="Logo"></div><h1>Painel de Produção</h1><p>Entre com seu e-mail e senha para acessar o sistema.</p><form id="login-form"><label>E-mail<input id="login-email" type="email" autocomplete="username" required placeholder="seuemail@empresa.com"></label><label>Senha<input id="login-password" type="password" autocomplete="current-password" required placeholder="Sua senha"></label><div id="login-error" class="login-error hidden"></div><button id="login-button" class="button primary" type="submit">Entrar</button></form><small class="login-foot">Acesso restrito à equipe autorizada</small></section></main><script src="./auth-client.js"></script><script src="./login.js"></script></body></html>
