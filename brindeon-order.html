<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fazer pedido · BrindeOn</title><style>
*{box-sizing:border-box}body{margin:0;padding:20px;font:15px system-ui;color:#21321b;background:#fff}h2{font-size:20px;margin:0 0 16px}label{display:grid;gap:6px;margin-bottom:12px;font-size:14px}input,select,textarea,button{font:inherit;border:1px solid #dce4d7;border-radius:9px;padding:10px;background:white;color:inherit;min-width:0}button{cursor:pointer}button.primary{background:#a0e900;border-color:#a0e900;font-weight:650}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #e2e8de;border-radius:12px;padding:14px;margin-bottom:12px;background:#fafcf7}.summary{padding:15px;border-radius:12px;background:#edf6df;margin:12px 0}.error{color:#a32920}.muted{color:#63715c;font-size:13px}[hidden]{display:none!important}#status{white-space:pre-wrap}form{margin:0}button.remove{float:right;padding:3px 8px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}@media(max-width:430px){.grid{grid-template-columns:1fr}body{padding:12px}}</style>
<div id="status" role="status">Conectando à produção…</div>
<form id="login" hidden><h2>Entrar na produção</h2><p>Use seu acesso do Painel de Produção.</p><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">Entrar</button></form>
<form id="order" hidden><h2>Fazer pedido</h2><label>Cliente<input id="customer" required maxlength="120"></label><div class="grid"><label>Prazo<input id="due" type="date"></label><label>Forma de pagamento<select id="method"><option value="pix">PIX</option><option value="cartao_credito">Cartão de crédito</option><option value="cartao_debito">Cartão de débito</option><option value="dinheiro">Dinheiro</option><option value="boleto">Boleto</option><option value="transferencia">Transferência</option><option value="outro">Outro</option></select></label></div><div id="items"></div><button id="add" type="button">+ Adicionar produto</button><div class="summary"><b id="total"></b><p id="balance"></p></div><label>Valor já recebido (R$)<input id="paid" type="number" min="0" step="0.01" value="0" required></label><p class="muted">Informe apenas pagamentos que você já recebeu. O saldo fica pendente.</p><label>Observações internas<textarea id="notes" maxlength="2000" rows="2"></textarea></label><label>Arte do cliente (PNG/JPG, até 10 MB)<input id="file" type="file" accept="image/png,image/jpeg"></label><p id="art" class="muted"></p><button class="primary" id="confirm">Confirmar pedido na produção</button></form>
<script src="./auth-client.js"></script><script>
(()=>{'use strict';const origin='https://brindeon-atendimento.gramix360.chatgpt.site';const nonce=location.hash.slice(1);if(window.parent===window||!/^[a-f0-9-]{36}$/.test(nonce)){document.getElementById('status').textContent='Abra este formulário pelo BrindeOn.';return}const $=id=>document.getElementById(id);let context,products=[],variants=[],busy=false,saved=null,pendingFile=null;const money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const send=(type,data={})=>parent.postMessage({type,nonce,...data},origin);const show=(message,error=false)=>{$('status').textContent=message;$('status').className=error?'error':''};async function api(path,body){const session=await PPAuth.getSession();if(!session)throw Error('Entre novamente na produção.');const r=await fetch(PPAuth.url+'/rest/v1/'+path,{method:body?'POST':'GET',headers:{apikey:PPAuth.key,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok){let d;try{d=await r.json()}catch{}throw Error(d?.message||'Não foi possível acessar a produção.')}return r.json()}
function snapshot(o){return {id:o.id,number:String(o.order_number),customer:o.customer_name,due:o.due_date,total:o.total_amount,paid:o.amount_paid,method:o.payment_method,status:o.status,updatedAt:o.updated_at,items:(o.order_items||[]).map(i=>({product:i.product_name,quantity:i.quantity,price:i.unit_price,personalization:i.personalization}))}}
function notify(){send('brindeon-order-saved',{order:saved,reference:context.reference})}
async function start(){if(!context)return;const session=await PPAuth.getSession();if(!session){$('login').hidden=false;show('');return}$('login').hidden=true;if(context.orderId){const rows=await api('orders?id=eq.'+encodeURIComponent(context.orderId)+'&select=id,order_number,customer_name,due_date,total_amount,amount_paid,payment_method,status,updated_at,order_items(product_name,quantity,unit_price,personalization)&deleted_at=is.null');if(!rows.length)throw Error('Pedido não encontrado.');saved=snapshot(rows[0]);notify();show('Pedido carregado.');return}
products=await api('products?select=id,name,sku,sale_price,product_kind&active=eq.true&deleted_at=is.null&order=name.asc&limit=1000');variants=await api('product_variants?select=id,product_id,name,sale_price&active=eq.true&limit=3000');$('customer').value=context.customer;$('order').hidden=false;$('items').textContent='';add();show('');}
function add(){const row=document.createElement('div');row.className='item';row.innerHTML='<button type="button" class="remove" aria-label="Remover produto">×</button><label>Produto<select class="product" required><option value="">Selecione um produto</option></select></label><label class="variation" hidden>Variação<select class="variant"></select></label><div class="grid"><label>Quantidade<input class="qty" type="number" min="1" max="100000" step="1" value="1" required></label><label>Valor unitário (R$)<input class="price" type="number" min="0" max="1000000" step="0.01" required></label></div><label>Personalização<input class="personalization" maxlength="1000" placeholder="Logo, cor, gravação…"></label>';
const select=row.querySelector('.product'),variant=row.querySelector('.variant');products.forEach(p=>select.add(new Option(p.name+(p.sku?' · '+p.sku:''),p.id)));select.onchange=()=>{const p=products.find(p=>p.id===select.value);variant.textContent='';const variable=p?.product_kind==='variable';row.querySelector('.variation').hidden=!variable;variant.required=variable;if(variable){variant.add(new Option('Selecione a variação',''));variants.filter(v=>v.product_id===p.id).forEach(v=>variant.add(new Option(v.name,v.id)))}row.querySelector('.price').value=p?.sale_price||0;totals()};variant.onchange=()=>{row.querySelector('.price').value=variants.find(v=>v.id===variant.value)?.sale_price||0;totals()};row.querySelector('.remove').onclick=()=>{if($('items').children.length>1){row.remove();totals()}};row.oninput=totals;$('items').append(row);totals()}
function values(){return [...$('items').children].map(row=>({product_id:row.querySelector('.product').value,variant_id:row.querySelector('.variant').value||null,quantity:Number(row.querySelector('.qty').value),price:Number(row.querySelector('.price').value),personalization:row.querySelector('.personalization').value}))}function totals(){const total=values().reduce((s,i)=>s+Math.round(i.quantity*i.price*100),0)/100;$('total').textContent='Total: '+money(total);$('balance').textContent='Saldo: '+money(Math.max(0,total-Number($('paid').value)));$('paid').max=String(total)}$('paid').oninput=totals;$('add').onclick=()=>{if($('items').children.length<30)add()};
$('login').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;const b=e.submitter;b.disabled=true;try{const r=await fetch(PPAuth.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:PPAuth.key,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});if(!r.ok)throw Error('Confira seu e-mail e sua senha.');const s=await r.json();PPAuth.saveSession({...s,expires_at:Date.now()+s.expires_in*1000});$('password').value='';await start()}catch(e){show(e.message,true)}finally{busy=false;b.disabled=false}};
async function upload(){if(!pendingFile)return;const f=pendingFile;if(!['image/png','image/jpeg'].includes(f.type)||f.size>10485760)throw Error('Use PNG/JPG de até 10 MB.');const s=await PPAuth.getSession();if(!s)throw Error('Entre novamente para anexar a arte.');const path=saved.id+'/brindeon-art.'+(f.type==='image/png'?'png':'jpg'),headers={apikey:PPAuth.key,Authorization:'Bearer '+s.access_token};let r=await fetch(PPAuth.url+'/storage/v1/object/client-files/'+path,{method:'POST',headers:{...headers,'Content-Type':f.type,'x-upsert':'true'},body:f});if(!r.ok)throw Error('Pedido salvo, mas a arte não foi anexada. Tente novamente.');const existing=await api('order_files?select=id&order_id=eq.'+saved.id+'&storage_path=eq.'+encodeURIComponent(path));if(!existing.length){r=await fetch(PPAuth.url+'/rest/v1/order_files',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({order_id:saved.id,file_name:f.name,storage_path:path,mime_type:f.type,file_size:f.size})});if(!r.ok)throw Error('Pedido salvo, mas falta concluir o anexo. Tente novamente.')}pendingFile=null;}
$('order').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;const button=$('confirm');button.disabled=true;try{if(!saved){pendingFile=$('file').files[0]||null;if(pendingFile&&(!['image/png','image/jpeg'].includes(pendingFile.type)||pendingFile.size>10485760))throw Error('Use PNG/JPG de até 10 MB.');saved=await api('rpc/brindeon_create_order',{p_reference:context.reference,p_order:{customer:$('customer').value,phone:context.phone,due:$('due').value,method:$('method').value,paid:Number($('paid').value),notes:$('notes').value,items:values()}})}await upload();$('order').hidden=true;show('Pedido #'+saved.number+' confirmado na produção.');notify()}catch(e){show(e.message,true);button.textContent=saved?'Concluir anexo do pedido':'Tentar confirmar novamente'}finally{busy=false;button.disabled=false}};
window.addEventListener('message',event=>{if(event.origin!==origin||event.source!==parent||event.data?.nonce!==nonce||event.data.type!=='brindeon-order-init'||context)return;context=event.data;start().catch(e=>show(e.message,true))});send('brindeon-order-ready');
})();</script></html>
